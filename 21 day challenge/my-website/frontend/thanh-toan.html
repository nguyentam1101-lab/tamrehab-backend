<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán SePay</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f1ea; margin:0; padding:32px 16px; color:#1d1a17; }
    .wrap { max-width:960px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.05); border:1px solid #e8dcc5; padding:24px; }
    .grid { display:grid; grid-template-columns:1fr 1.1fr; gap:24px; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    input, textarea, button { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid #d3c1a3; font-size:15px; }
    textarea { min-height:110px; resize:vertical; }
    button { background:#1d2d2f; color:#fff; cursor:pointer; border:none; font-weight:700; }
    .panel { background:#fffaf5; border:1px solid #ebdcbe; border-radius:10px; padding:18px; }
    .status { margin-top:16px; border-radius:8px; padding:12px; }
    .success { background:#eaf8ec; border:1px solid #7fbc79; }
    .error { background:#fdeceb; border:1px solid #d7726d; }
    .qr { width:100%; max-width:280px; display:block; margin-top:12px; border:4px solid #fff; border-radius:10px; }
    .muted { color:#685f59; }
    @media (max-width: 760px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Test thanh toán SePay</h1>
    <div class="grid">
      <div>
        <form id="paymentForm">
          <div>
            <label>Họ tên</label>
            <input type="text" id="ho_ten" required />
          </div>
          <div style="margin-top:14px;">
            <label>Số điện thoại</label>
            <input type="text" id="so_dien_thoai" required />
          </div>
          <div style="margin-top:14px;">
            <label>Mô tả đơn hàng</label>
            <textarea id="mo_ta"></textarea>
          </div>
          <div style="margin-top:16px;">
            <button type="submit">Tạo đơn hàng</button>
          </div>
        </form>
        <div id="messageBox" class="status" style="display:none"></div>
      </div>

      <div class="panel">
        <h2>Thông tin thanh toán</h2>
        <p><strong>Số tiền:</strong> 2.000đ</p>
        <div id="orderInfo" class="muted">
          <p><strong>Nội dung chuyển khoản:</strong> <span id="contentValue">--</span></p>
        </div>
        <img id="qrImage" class="qr" alt="QR SePay" style="display:none;" />
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://backend-tamrehab.onrender.com';
    const form = document.getElementById('paymentForm');
    const messageBox = document.getElementById('messageBox');
    const qrcode = document.getElementById('qrImage');
    const contentValue = document.getElementById('contentValue');

    document.getElementById('ho_ten').addEventListener('input', function () {
      const name = this.value.trim();
      const moTa = document.getElementById('mo_ta');
      moTa.value = name ? 'TEST - ' + name : '';
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      messageBox.style.display = 'none';
      messageBox.className = 'status';

      const payload = {
        ho_ten: document.getElementById('ho_ten').value.trim(),
        so_dien_thoai: document.getElementById('so_dien_thoai').value.trim(),
        mo_ta: document.getElementById('mo_ta').value.trim()
      };

      try {
        const response = await fetch(API_URL + '/api/create-order.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Không thể tạo đơn hàng');
        }

        contentValue.textContent = result.content;
        qrcode.src = result.qr_url;
        qrcode.style.display = 'block';

        messageBox.classList.add('success');
        messageBox.textContent = 'Tạo đơn hàng thành công.';
        messageBox.style.display = 'block';

        localStorage.setItem('latestOrder', JSON.stringify({
          order_id: result.order_id,
          amount: result.amount,
          content: result.content
        }));

        window.location.href = 'cam-on.html?order=' + encodeURIComponent(result.order_id);
      } catch (error) {
        messageBox.classList.add('error');
        messageBox.textContent = error.message || 'Đã xảy ra lỗi.';
        messageBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
