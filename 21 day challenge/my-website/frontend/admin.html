<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin panel</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4efe7; margin:0; padding:24px; color:#261e18; }
    .wrap { max-width:1200px; margin:0 auto; }
    nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    nav button { background:#fffaf3; border:1px solid #ba9e6f; border-radius:6px; padding:10px 14px; cursor:pointer; }
    nav button.active { background:#2d261f; color:#fff; }
    .panel { background:#fffdf9; border:1px solid #e4d8c5; border-radius:10px; padding:16px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { padding:10px; text-align:left; border-bottom:1px solid #ead8bb; }
    th { background:#f0e6d4; }
    .notice { padding:10px 12px; border-radius:8px; margin-bottom:12px; }
    .success { background:#eaf8ec; border:1px solid #7fbc79; }
    .error { background:#fdeceb; border:1px solid #d7726d; }
    form { display:grid; gap:8px; }
    input, select, textarea { width:100%; box-sizing:border-box; padding:9px; border:1px solid #d0b998; border-radius:6px; }
    textarea { min-height:80px; }
    .actions { display:flex; gap:10px; margin-top:8px; }
    button.primary { background:#1c2a2d; color:#fff; border:none; border-radius:6px; padding:10px 12px; cursor:pointer; }
    button.secondary { background:#f0e5d7; border:1px solid #b68d58; border-radius:6px; padding:10px 12px; cursor:pointer; }
    .layout { display:grid; grid-template-columns:320px 1fr; gap:18px; }
    @media (max-width: 760px) { .layout { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin panel</h1>
    <nav>
      <button class="tab-btn active" data-tab="products">Sản phẩm</button>
      <button class="tab-btn" data-tab="customers">Khách hàng</button>
      <button class="tab-btn" data-tab="orders">Đơn hàng</button>
    </nav>
    <div id="notice" class="notice" style="display:none"></div>

    <div class="layout">
      <div class="panel" id="formPanel"></div>
      <div class="panel">
        <div id="tablePanel"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://backend-tamrehab.onrender.com';
    const state = { tab: 'products', editId: null };

    function showNotice(message, type = 'success') {
      const box = document.getElementById('notice');
      box.textContent = message;
      box.className = 'notice ' + type;
      box.style.display = 'block';
    }

    function renderForm(tab) {
      const panel = document.getElementById('formPanel');
      if (tab === 'products') {
        panel.innerHTML = `
          <h2>Thêm sản phẩm</h2>
          <form id="productForm">
            <input type="hidden" name="action" value="save_product" />
            <label>Tên sản phẩm</label>
            <input name="name" required />
            <label>Loại</label>
            <select name="product_type">
              <option value="physical">physical</option>
              <option value="digital">digital</option>
              <option value="service" selected>service</option>
            </select>
            <label>Giá</label>
            <input name="price" type="number" min="0" step="0.01" required />
            <label>Mô tả</label>
            <textarea name="description"></textarea>
            <label>Số lượng tồn</label>
            <input name="stock_quantity" type="number" min="0" />
            <div class="actions">
              <button class="primary" type="submit">Lưu</button>
            </div>
          </form>
        `;
      }

      if (tab === 'customers') {
        panel.innerHTML = `
          <h2>Thêm khách hàng</h2>
          <form id="customerForm">
            <input type="hidden" name="action" value="save_customer" />
            <label>Tên</label>
            <input name="name" required />
            <label>Số điện thoại</label>
            <input name="phone" />
            <label>Zalo</label>
            <input name="zalo" />
            <label>Ngày đăng ký</label>
            <input name="registered_at" type="date" />
            <div class="actions">
              <button class="primary" type="submit">Lưu</button>
            </div>
          </form>
        `;
      }

      if (tab === 'orders') {
        panel.innerHTML = `
          <h2>Thêm đơn hàng</h2>
          <form id="orderForm">
            <input type="hidden" name="action" value="save_order" />
            <label>Mã đơn hàng</label>
            <input name="order_id" required />
            <label>Sản phẩm</label>
            <select name="product_id" id="orderProductSelect"></select>
            <label>Số lượng</label>
            <input name="quantity" type="number" min="1" value="1" required />
            <label>Số tiền</label>
            <input name="amount" type="number" min="0" step="0.01" required />
            <label>Nội dung</label>
            <textarea name="content"></textarea>
            <label>Trạng thái</label>
            <select name="status">
              <option value="pending">pending</option>
              <option value="success">success</option>
            </select>
            <div class="actions">
              <button class="primary" type="submit">Lưu</button>
            </div>
          </form>
        `;
      }
    }

    async function loadProducts() {
      const res = await fetch(API_URL + '/api/products.php');
      const data = await res.json();
      return data.items || [];
    }

    async function loadCustomers() {
      const res = await fetch(API_URL + '/api/customers.php');
      const data = await res.json();
      return data.items || [];
    }

    async function loadOrders() {
      const res = await fetch(API_URL + '/api/orders.php');
      const data = await res.json();
      return data.items || [];
    }

    function renderTable(tab, items) {
      const panel = document.getElementById('tablePanel');
      if (tab === 'products') {
        panel.innerHTML = `
          <h2>Sản phẩm</h2>
          <table>
            <thead><tr><th>Tên</th><th>Loại</th><th>Giá</th><th>Tồn kho</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.name}</td>
                  <td>${item.product_type}</td>
                  <td>${Number(item.price).toLocaleString('vi-VN')} VNĐ</td>
                  <td>${item.stock_quantity ?? '—'}</td>
                </tr>
              `).join('') || '<tr><td colspan="4">Không có dữ liệu</td></tr>'}
            </tbody>
          </table>
        `;
      }

      if (tab === 'customers') {
        panel.innerHTML = `
          <h2>Khách hàng</h2>
          <table>
            <thead><tr><th>Tên</th><th>Điện thoại</th><th>Zalo</th><th>Ngày đăng ký</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.name}</td>
                  <td>${item.phone ?? '—'}</td>
                  <td>${item.zalo ?? '—'}</td>
                  <td>${item.registered_at ?? '—'}</td>
                </tr>
              `).join('') || '<tr><td colspan="4">Không có dữ liệu</td></tr>'}
            </tbody>
          </table>
        `;
      }

      if (tab === 'orders') {
        panel.innerHTML = `
          <h2>Đơn hàng</h2>
          <table>
            <thead><tr><th>Mã đơn</th><th>Sản phẩm</th><th>Số tiền</th><th>Trạng thái</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.order_id}</td>
                  <td>${item.product_name ?? '—'}</td>
                  <td>${Number(item.amount).toLocaleString('vi-VN')} VNĐ</td>
                  <td>${item.status}</td>
                </tr>
              `).join('') || '<tr><td colspan="4">Không có dữ liệu</td></tr>'}
            </tbody>
          </table>
        `;
      }
    }

    async function refreshTab() {
      const tab = state.tab;
      renderForm(tab);
      if (tab === 'products') {
        const items = await loadProducts();
        renderTable(tab, items);
        return;
      }
      if (tab === 'customers') {
        const items = await loadCustomers();
        renderTable(tab, items);
        return;
      }
      if (tab === 'orders') {
        const items = await loadOrders();
        renderTable(tab, items);
        const products = await loadProducts();
        const select = document.getElementById('orderProductSelect');
        if (select) {
          select.innerHTML = products.map(p => `<option value="${p.id}">${p.name} (${p.product_type})</option>`).join('');
        }
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tab = btn.dataset.tab;
        refreshTab();
      });
    });

    document.addEventListener('submit', async (event) => {
      if (event.target && event.target.id === 'productForm') {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const response = await fetch(API_URL + '/api/products.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'save_product', ...data })
        });
        const result = await response.json();
        if (result.success) { showNotice('Đã lưu sản phẩm.', 'success'); refreshTab(); }
        else { showNotice(result.message || 'Lỗi', 'error'); }
      }

      if (event.target && event.target.id === 'customerForm') {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const response = await fetch(API_URL + '/api/customers.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'save_customer', ...data })
        });
        const result = await response.json();
        if (result.success) { showNotice('Đã lưu khách hàng.', 'success'); refreshTab(); }
        else { showNotice(result.message || 'Lỗi', 'error'); }
      }

      if (event.target && event.target.id === 'orderForm') {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const response = await fetch(API_URL + '/api/orders.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'save_order', ...data })
        });
        const result = await response.json();
        if (result.success) { showNotice('Đã lưu đơn hàng.', 'success'); refreshTab(); }
        else { showNotice(result.message || 'Lỗi', 'error'); }
      }
    });

    refreshTab();
  </script>
</body>
</html>
