<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán SePay</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f1ea; margin:0; padding:32px 16px; color:#1d1a17; }
    .wrap { max-width:960px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.05); border:1px solid #e8dcc5; padding:24px; }
    .grid { display:grid; grid-template-columns:1fr 1.1fr; gap:24px; }
    label { display:block; font-weight:700; margin-bottom:8px; }
    input, textarea, button { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid #d3c1a3; font-size:15px; }
    textarea { min-height:110px; resize:vertical; }
    button { background:#1d2d2f; color:#fff; cursor:pointer; border:none; font-weight:700; }
    button:disabled { background:#999; cursor:not-allowed; }
    .panel { background:#fffaf5; border:1px solid #ebdcbe; border-radius:10px; padding:18px; }
    .status { margin-top:16px; border-radius:8px; padding:12px; }
    .success { background:#eaf8ec; border:1px solid #7fbc79; }
    .error { background:#fdeceb; border:1px solid #d7726d; }
    .qr { width:100%; max-width:280px; display:block; margin-top:12px; border:4px solid #fff; border-radius:10px; }
    .muted { color:#685f59; }
    .hidden { display:none !important; }
    .payment-info { text-align:center; }
    .payment-info .amount { font-size:32px; font-weight:700; color:#1d2d2f; margin:8px 0; }
    .payment-info .content { font-size:20px; font-weight:700; color:#c0392b; letter-spacing:1px; margin:8px 0; padding:8px; background:#fff; border:1px dashed #c0392b; border-radius:6px; }
    .payment-info .order-id { font-size:14px; color:#685f59; margin-bottom:16px; }
    .waiting { margin-top:16px; padding:12px; background:#fff3cd; border:1px solid #ffc107; border-radius:8px; color:#856404; }
    .waiting .spinner { display:inline-block; width:16px; height:16px; border:2px solid #856404; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width: 760px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Test thanh toán SePay</h1>
    <div class="grid">
      <div>
        <form id="paymentForm">
          <div>
            <label>Họ tên</label>
            <input type="text" id="ho_ten" required />
          </div>
          <div style="margin-top:14px;">
            <label>Số điện thoại</label>
            <input type="text" id="so_dien_thoai" required />
          </div>
          <div style="margin-top:14px;">
            <label>Mô tả đơn hàng</label>
            <textarea id="mo_ta"></textarea>
          </div>
          <div style="margin-top:16px;">
            <button type="submit" id="submitBtn">Tạo đơn hàng</button>
          </div>
        </form>
        <div id="messageBox" class="status" style="display:none"></div>
      </div>

      <div class="panel">
        <h2>Thông tin thanh toán</h2>
        <div id="placeholderText" class="muted">
          <p>Vui lòng nhập thông tin và bấm "Tạo đơn hàng" để hiển thị QR code.</p>
        </div>
        <div id="paymentInfo" class="payment-info hidden">
          <p class="order-id">Mã đơn: <span id="orderId">--</span></p>
          <p><strong>Số tiền:</strong></p>
          <p class="amount" id="amountValue">--</p>
          <p><strong>Nội dung chuyển khoản:</strong></p>
          <p class="content" id="contentValue">--</p>
          <img id="qrImage" class="qr" alt="QR SePay" />
          <div id="waitingStatus" class="waiting">
            <span class="spinner"></span>
            <span>Đang chờ thanh toán...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const form = document.getElementById('paymentForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageBox = document.getElementById('messageBox');
    const placeholderText = document.getElementById('placeholderText');
    const paymentInfo = document.getElementById('paymentInfo');
    const orderIdEl = document.getElementById('orderId');
    const amountValue = document.getElementById('amountValue');
    const contentValue = document.getElementById('contentValue');
    const qrImage = document.getElementById('qrImage');
    const waitingStatus = document.getElementById('waitingStatus');

    let pollInterval = null;

    document.getElementById('ho_ten').addEventListener('input', function () {
      const name = this.value.trim();
      const moTa = document.getElementById('mo_ta');
      moTa.value = name ? 'TEST - ' + name : '';
    });

    function showMessage(text, type) {
      messageBox.style.display = 'block';
      messageBox.className = 'status ' + type;
      messageBox.textContent = text;
    }

    function hideMessage() {
      messageBox.style.display = 'none';
    }

    function startPolling(orderId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(API_URL + '/api/order-status?order_id=' + encodeURIComponent(orderId));
          const data = await res.json();
          if (data.success && data.status === 'success') {
            clearInterval(pollInterval);
            pollInterval = null;
            window.location.href = 'cam-on.html?order=' + encodeURIComponent(orderId);
          }
        } catch (e) {
          // ignore poll errors, retry next interval
        }
      }, 3000);
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      hideMessage();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang tạo...';

      const payload = {
        ho_ten: document.getElementById('ho_ten').value.trim(),
        so_dien_thoai: document.getElementById('so_dien_thoai').value.trim(),
        mo_ta: document.getElementById('mo_ta').value.trim()
      };

      try {
        const response = await fetch(API_URL + '/api/create-order.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Không thể tạo đơn hàng');
        }

        form.classList.add('hidden');
        placeholderText.classList.add('hidden');
        paymentInfo.classList.remove('hidden');

        orderIdEl.textContent = result.order_id;
        amountValue.textContent = new Intl.NumberFormat('vi-VN').format(result.amount) + 'đ';
        contentValue.textContent = result.content;
        qrImage.src = 'https://img.vietqr.io/image/BIDV-96247TGLA3-compact2.png?amount=' + result.amount + '&addInfo=' + encodeURIComponent(result.content) + '&accountName=' + encodeURIComponent('NGUYEN NGUYEN TAM');

        localStorage.setItem('latestOrder', JSON.stringify({
          order_id: result.order_id,
          amount: result.amount,
          content: result.content
        }));

        startPolling(result.order_id);
      } catch (error) {
        showMessage(error.message || 'Đã xảy ra lỗi.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Tạo đơn hàng';
      }
    });
  </script>
</body>
</html>
