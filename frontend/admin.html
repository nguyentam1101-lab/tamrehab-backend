<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - T.A.M REHAB</title>
  <style>
    :root { --opalya-dark: #35291F; --opalya-bg: #E5C483; --opalya-light: #F8F1E2; --opalya-card: #FFFBF5; --opalya-muted: #6E5D4F; --opalya-border: #D8B877; --tam-green: #4c8b45; --tam-green-dark: #3d7238; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#f4efe7; margin:0; padding:24px; color:#261e18; }
    .wrap { max-width:1200px; margin:0 auto; }
    .header { display:flex; align-items:center; gap:14px; padding-bottom:18px; border-bottom:2px solid var(--opalya-border); margin-bottom:18px; }
    .logo { width:48px; height:48px; background:var(--opalya-dark); color:var(--opalya-light); border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:16px; letter-spacing:1px; flex-shrink:0; }
    .brand h1 { margin:0; color:var(--opalya-dark); font-size:22px; font-weight:800; }
    .brand .subtitle { margin:2px 0 0; color:var(--opalya-muted); font-size:13px; }
    nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    nav button { background:#fffaf3; border:1px solid var(--opalya-border); border-radius:6px; padding:10px 14px; cursor:pointer; font-weight:600; color:var(--opalya-dark); transition:all .2s; }
    nav button:hover { background:var(--opalya-bg); }
    nav button.active { background:var(--opalya-dark); color:var(--opalya-light); border-color:var(--opalya-dark); }
    .panel { background:var(--opalya-card); border:1px solid var(--opalya-border); border-radius:10px; padding:16px; }
    .panel h2 { margin:0 0 10px; color:var(--opalya-dark); font-size:18px; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { padding:10px; text-align:left; border-bottom:1px solid #ead8bb; }
    th { background:#f0e6d4; color:var(--opalya-dark); }
    .notice { padding:10px 12px; border-radius:8px; margin-bottom:12px; }
    .success { background:#eaf8ec; border:1px solid #7fbc79; }
    .error { background:#fdeceb; border:1px solid #d7726d; }
    form { display:grid; gap:8px; }
    label { display:block; font-weight:bold; font-size:13px; color:var(--opalya-dark); }
    input, select, textarea { width:100%; box-sizing:border-box; padding:9px; border:1px solid var(--opalya-border); border-radius:6px; background:#fff; color:var(--opalya-dark); }
    input:focus, select:focus, textarea:focus { outline:2px solid rgba(184,134,11,.3); border-color:#B8863A; }
    textarea { min-height:80px; }
    .actions { display:flex; gap:10px; margin-top:8px; }
    button.primary { background:var(--tam-green); color:#fff; border:none; border-radius:6px; padding:10px 14px; cursor:pointer; font-weight:700; transition:background .2s; }
    button.primary:hover { background:var(--tam-green-dark); }
    button.secondary { background:#f0e5d7; border:1px solid #b68d58; border-radius:6px; padding:10px 12px; cursor:pointer; }
    .layout { display:grid; grid-template-columns:320px 1fr; gap:18px; }
    footer { text-align:center; color:var(--opalya-muted); font-size:13px; padding:20px 0 8px; border-top:1px solid var(--opalya-border); margin-top:28px; }
    @media (max-width: 760px) { body { padding:14px; } .layout { grid-template-columns:1fr; } .brand h1 { font-size:18px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">TAM</div>
      <div class="brand">
        <h1>T.A.M REHAB - Quản trị hệ thống</h1>
        <p class="subtitle">Dịch vụ giãn cơ trị liệu chuyên sâu</p>
      </div>
    </div>
    <nav>
      <button class="tab-btn active" data-tab="products">Sản phẩm</button>
      <button class="tab-btn" data-tab="customers">Khách hàng</button>
      <button class="tab-btn" data-tab="orders">Đơn hàng</button>
    </nav>
    <div id="notice" class="notice" style="display:none"></div>

    <div class="layout">
      <div class="panel" id="formPanel"></div>
      <div class="panel">
        <div id="tablePanel"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://tamrehab-backend.onrender.com';
    const state = { tab: 'products', editId: null, editOrder: null };

    function nextOrderId() {
      const now = new Date();
      const stamp = now.getFullYear().toString()
        + String(now.getMonth() + 1).padStart(2, '0')
        + String(now.getDate()).padStart(2, '0')
        + String(now.getHours()).padStart(2, '0')
        + String(now.getMinutes()).padStart(2, '0')
        + String(now.getSeconds()).padStart(2, '0');
      return 'TAM-' + stamp;
    }

    function showNotice(message, type = 'success') {
      const box = document.getElementById('notice');
      box.textContent = message;
      box.className = 'notice ' + type;
      box.style.display = 'block';
    }

    function renderForm(tab) {
      const panel = document.getElementById('formPanel');
      if (tab === 'products') {
        panel.innerHTML = `
          <h2>Thêm sản phẩm</h2>
          <form id="productForm">
            <input type="hidden" name="action" value="save_product" />
            <label>Tên sản phẩm</label>
            <input name="name" required />
            <label>Loại</label>
            <select name="product_type">
              <option value="physical">physical</option>
              <option value="digital">digital</option>
              <option value="service" selected>service</option>
            </select>
            <label>Giá</label>
            <input name="price" type="number" min="0" step="0.01" required />
            <label>Mô tả</label>
            <textarea name="description"></textarea>
            <label>Số lượng tồn</label>
            <input name="stock_quantity" type="number" min="0" />
            <div class="actions">
              <button class="primary" type="submit">Lưu</button>
            </div>
          </form>
        `;
      }

      if (tab === 'customers') {
        panel.innerHTML = `
          <h2>Thêm khách hàng</h2>
          <form id="customerForm">
            <input type="hidden" name="action" value="save_customer" />
            <label>Tên</label>
            <input name="name" required />
            <label>Số điện thoại</label>
            <input name="phone" />
            <label>Email</label>
            <input name="email" type="email" />
            <label>Zalo</label>
            <input name="zalo" />
            <label>Ngày đăng ký</label>
            <input name="registered_at" type="date" />
            <div class="actions">
              <button class="primary" type="submit">Lưu</button>
            </div>
          </form>
        `;
      }

      if (tab === 'orders') {
        const order = state.editOrder || {};
        const isEdit = Boolean(order.id);
        panel.innerHTML = `
          <h2>${isEdit ? 'Sửa đơn hàng' : 'Thêm đơn hàng'}</h2>
          <p class="subtitle">Email có +test (ví dụ nguyentam1101+test@gmail.com) sẽ nhận 1 mail xác nhận đơn + đủ 3 mail chăm sóc ngay. Dùng mã đơn mới rồi bấm Lưu.</p>
          <form id="orderForm">
            <input type="hidden" name="action" value="save_order" />
            <input type="hidden" name="id" value="${order.id || ''}" />
            <label>Mã đơn hàng</label>
            <input name="order_id" required value="${order.order_id || nextOrderId()}" />
            <label>Tên khách hàng</label>
            <input name="customer_name" value="${order.customer_name || ''}" />
            <label>Số điện thoại</label>
            <input name="phone" value="${order.phone || ''}" />
            <label>Email nhận xác nhận</label>
            <input name="email" type="email" required placeholder="ban+test@gmail.com" value="${order.email || ''}" />
            <label>Sản phẩm</label>
            <select name="product_id" id="orderProductSelect"></select>
            <label>Số lượng</label>
            <input name="quantity" type="number" min="1" value="${order.quantity || 1}" required />
            <label>Số tiền</label>
            <input name="amount" type="number" min="0" step="0.01" value="${order.amount || ''}" required />
            <label>Nội dung</label>
            <textarea name="content">${order.content || ''}</textarea>
            <label>Trạng thái</label>
            <select name="status">
              <option value="pending" ${order.status === 'success' ? '' : 'selected'}>pending</option>
              <option value="success" ${order.status === 'success' ? 'selected' : ''}>success</option>
            </select>
            <div class="actions">
              <button class="primary" type="submit">Lưu và gửi email</button>
              ${isEdit ? '<button class="secondary" type="button" id="cancelEditOrder">Hủy sửa</button>' : ''}
            </div>
          </form>
        `;
      }
    }

    async function loadProducts() {
      const res = await fetch(API_URL + '/api/products.php');
      const data = await res.json();
      return data.items || [];
    }

    async function loadCustomers() {
      const res = await fetch(API_URL + '/api/customers.php');
      const data = await res.json();
      return data.items || [];
    }

    async function loadOrders() {
      const res = await fetch(API_URL + '/api/orders.php');
      const data = await res.json();
      return data.items || [];
    }

    function renderTable(tab, items) {
      const panel = document.getElementById('tablePanel');
      if (tab === 'products') {
        panel.innerHTML = `
          <h2>Sản phẩm</h2>
          <table>
            <thead><tr><th>Tên</th><th>Loại</th><th>Giá</th><th>Tồn kho</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.name}</td>
                  <td>${item.product_type}</td>
                  <td>${Number(item.price).toLocaleString('vi-VN')} VNĐ</td>
                  <td>${item.stock_quantity ?? '—'}</td>
                  <td><button type="button" data-edit="product" data-id="${item.id}">Sửa</button> <button type="button" data-delete="product" data-id="${item.id}">Xóa</button></td>
                </tr>
              `).join('') || '<tr><td colspan="5">Không có dữ liệu</td></tr>'}
            </tbody>
          </table>
        `;
      }

      if (tab === 'customers') {
        panel.innerHTML = `
          <h2>Khách hàng</h2>
          <table>
            <thead><tr><th>Tên</th><th>Điện thoại</th><th>Email</th><th>Zalo</th><th>Ngày đăng ký</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.name}</td>
                  <td>${item.phone ?? '—'}</td>
                  <td>${item.email ?? '—'}</td>
                  <td>${item.zalo ?? '—'}</td>
                  <td>${item.registered_at ?? '—'}</td>
                  <td><button type="button" data-edit="customer" data-id="${item.id}">Sửa</button> <button type="button" data-delete="customer" data-id="${item.id}">Xóa</button></td>
                </tr>
              `).join('') || '<tr><td colspan="6">Không có dữ liệu</td></tr>'}
            </tbody>
          </table>
        `;
      }

      if (tab === 'orders') {
        panel.innerHTML = `
          <h2>Đơn hàng</h2>
          <table>
            <thead><tr><th>Mã đơn</th><th>Khách</th><th>Email</th><th>Sản phẩm</th><th>Số tiền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td>${item.order_id}</td>
                  <td>${item.customer_name ?? '—'}</td>
                  <td>${item.email ?? '—'}</td>
                  <td>${item.product_name ?? '—'}</td>
                  <td>${Number(item.amount).toLocaleString('vi-VN')} VNĐ</td>
                  <td>${item.status}</td>
                  <td>${item.status !== 'success' ? `<button type="button" data-approve-order="${item.id}">Duyệt</button>` : ''} <button type="button" data-edit="order" data-id="${item.id}">Sửa</button> <button type="button" data-send-order-email="${item.id}">Gửi email xác nhận</button> <button type="button" data-delete="order" data-id="${item.id}">Xóa</button></td>
                </tr>
              `).join('') || '<tr><td colspan="7">Không có dữ liệu</td></tr>'}
            </tbody>
          </table>
        `;
      }
    }

    async function refreshTab() {
      const tab = state.tab;
      renderForm(tab);
      if (tab === 'products') {
        const items = await loadProducts();
        renderTable(tab, items);
        return;
      }
      if (tab === 'customers') {
        const items = await loadCustomers();
        renderTable(tab, items);
        return;
      }
      if (tab === 'orders') {
        const items = await loadOrders();
        renderTable(tab, items);
        const products = await loadProducts();
        const select = document.getElementById('orderProductSelect');
        if (select) {
          select.innerHTML = products.length
            ? products.map(p => `<option value="${p.id}">${p.name} (${p.product_type})</option>`).join('')
            : '<option value="">Chưa có sản phẩm — vẫn lưu được đơn</option>';
          if (state.editOrder && state.editOrder.product_id) {
            select.value = String(state.editOrder.product_id);
          }
        }
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tab = btn.dataset.tab;
        refreshTab();
      });
    });

    async function postAction(endpoint, payload) {
      const response = await fetch(API_URL + endpoint, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || 'Lỗi thao tác');
    }

    document.addEventListener('click', async event => {
      if (event.target && event.target.id === 'cancelEditOrder') {
        state.editOrder = null;
        refreshTab();
        return;
      }
      const control = event.target.closest('[data-edit], [data-delete], [data-approve-order], [data-send-order-email]');
      if (!control) return;
      try {
        if (control.dataset.sendOrderEmail) {
          const response = await fetch(API_URL + '/api/orders.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action: 'send_confirmation', id: control.dataset.sendOrderEmail })
          });
          const result = await response.json();
          showNotice(result.message || 'Không gửi được email', result.success ? 'success' : 'error');
          return;
        }
        if (control.dataset.approveOrder) {
          await postAction('/api/orders.php', {action: 'set_success', id: control.dataset.approveOrder});
          showNotice('Đã duyệt thanh toán.', 'success');
        } else if (control.dataset.delete) {
          if (!confirm('Bạn có chắc muốn xóa dữ liệu này?')) return;
          await postAction('/api/' + control.dataset.delete + 's.php', {action: 'delete_' + control.dataset.delete, id: control.dataset.id});
          showNotice('Đã xóa dữ liệu.', 'success');
        } else if (control.dataset.edit === 'order') {
          const items = await loadOrders();
          const item = items.find(entry => String(entry.id) === control.dataset.id);
          if (!item) throw new Error('Không tìm thấy đơn hàng');
          state.editOrder = item;
          refreshTab();
          return;
        } else {
          const type = control.dataset.edit;
          const endpoint = '/api/' + type + 's.php';
          const label = type === 'product' ? 'tên sản phẩm' : 'tên khách hàng';
          const value = prompt('Nhập ' + label + ' mới:');
          if (value === null || value.trim() === '') return;
          const current = await fetch(API_URL + endpoint).then(response => response.json());
          const item = (current.items || []).find(entry => String(entry.id) === control.dataset.id);
          if (!item) throw new Error('Không tìm thấy dữ liệu');
          await postAction(endpoint, {action: 'save_' + type, ...item, id: control.dataset.id, name: value.trim()});
          showNotice('Đã cập nhật dữ liệu.', 'success');
        }
        refreshTab();
      } catch (error) {
        showNotice(error.message || 'Lỗi thao tác', 'error');
      }
    });

    document.addEventListener('submit', async (event) => {
      if (event.target && event.target.id === 'productForm') {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const response = await fetch(API_URL + '/api/products.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'save_product', ...data })
        });
        const result = await response.json();
        if (result.success) { showNotice('Đã lưu sản phẩm.', 'success'); refreshTab(); }
        else { showNotice(result.message || 'Lỗi', 'error'); }
      }

      if (event.target && event.target.id === 'customerForm') {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const response = await fetch(API_URL + '/api/customers.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'save_customer', ...data })
        });
        const result = await response.json();
        if (result.success) { showNotice('Đã lưu khách hàng.', 'success'); refreshTab(); }
        else { showNotice(result.message || 'Lỗi', 'error'); }
      }

      if (event.target && event.target.id === 'orderForm') {
        event.preventDefault();
        const form = event.target;
        const data = Object.fromEntries(new FormData(form).entries());
        const response = await fetch(API_URL + '/api/orders.php', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ action: 'save_order', ...data })
        });
        const result = await response.json();
        if (result.success) {
          state.editOrder = null;
          showNotice(result.message || 'Đã lưu đơn hàng.', 'success');
          refreshTab();
        }
        else { showNotice(result.message || 'Lỗi', 'error'); }
      }
    });

    refreshTab();
    setInterval(async () => {
      if (state.tab !== 'orders') return;
      try {
        const items = await loadOrders();
        renderTable('orders', items);
      } catch (error) {
        console.warn('Order refresh error:', error);
      }
    }, 3000);
  </script>
  <footer>&copy; 2026 T.A.M REHAB - Dịch vụ giãn cơ trị liệu chuyên sâu</footer>
</body>
</html>
