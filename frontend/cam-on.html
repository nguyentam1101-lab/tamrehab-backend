<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cảm ơn bạn</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4efe7; display:grid; place-items:center; min-height:100vh; margin:0; }
    .box { max-width:760px; background:#fff; border-radius:12px; border:1px solid #e9dcc0; padding:32px; text-align:center; }
    h1 { margin-top:0; }
    .code { font-size:28px; font-weight:700; letter-spacing:1px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Cảm ơn bạn đã đặt hàng</h1>
    <p>Đơn hàng của bạn đang chờ xác nhận thanh toán.</p>
    <div class="code" id="orderCode">--</div>
    <p>Vui lòng chuyển khoản đúng nội dung hiển thị trên màn hình trước đó.</p>
    <a href="thanh-toan.html">Quay lại thanh toán</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const order = params.get('order');
    if (order) {
      document.getElementById('orderCode').textContent = order;
    }
  </script>
</body>
</html>
